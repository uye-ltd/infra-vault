
name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'vault/**'
      - 'docker/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Vault
        # Pin version explicitly; bump when upgrading Vault.
        run: |
          wget -O - https://apt.releases.hashicorp.com/gpg | \
            sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq
          sudo apt-get install -y vault=1.19.2-1
          vault version

      - name: Start Vault dev server
        run: |
          vault server -dev \
            -dev-root-token-id=ci-token \
            -dev-listen-address=127.0.0.1:8200 \
            > /tmp/vault-dev.log 2>&1 &
          timeout 30 bash -c \
            'until vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; do sleep 1; done'
        env:
          VAULT_SKIP_VERIFY: "true"

      - name: Validate HCL config syntax
        run: |
          vault operator diagnose -config=vault/config/vault.hcl 2>&1 | grep -v "^==" || true
          echo "Config OK"
        env:
          VAULT_SKIP_VERIFY: "true"

      - name: Validate policy files
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ci-token
        run: |
          for f in vault/policies/*.hcl; do
            name=$(basename "$f" .hcl)
            echo "Validating policy: $name"
            vault policy write "$name" "$f"
          done
          echo "All policies valid"

  build:
    name: Build, push, and sign vault-unseal image
    needs: validate
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign OIDC keyless signing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildah storage
        run: |
          # containers/storage requires runRoot when graphRoot is explicitly set.
          # The runner image bakes graphRoot=/kaniko but omits runRoot, which
          # causes "runroot must be set" at library init before CLI flags apply.
          printf '[storage]\n  driver = "overlay"\n  graphRoot = "/kaniko"\n  runRoot = "/tmp/buildah-run"\n\n[storage.options]\n\n  [storage.options.overlay]\n    mount_program = "/usr/bin/fuse-overlayfs"\n' \
            > /etc/containers/storage.conf

      - name: Build and push with Buildah
        id: build
        run: |
          IMAGE=ghcr.io/uye-ltd/vault-unseal
          buildah build \
            --file docker/vault-unseal/Dockerfile \
            --tag "${IMAGE}:${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --isolation=chroot \
            docker/vault-unseal
          buildah push --digestfile /tmp/digest.txt "${IMAGE}:${{ github.sha }}"
          echo "digest=$(cat /tmp/digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Sign image
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "ghcr.io/uye-ltd/vault-unseal@${{ steps.build.outputs.digest }}"

  promote:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/uye-ltd/vault-unseal
    steps:
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1
        with:
          cosign-release: 'v2.6.5'
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote signed digest
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          verified=$(cosign verify --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}:${GITHUB_SHA}")
          digest=$(jq -er '[.[].critical.image."docker-manifest-digest"] | unique | if length == 1 then .[0] else empty end' <<< "$verified")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --prefer-index=false --metadata-file /tmp/promoted.json --tag "${IMAGE}:latest" "${IMAGE}@${digest}"
          test "$(jq -r '."containerimage.descriptor".digest' /tmp/promoted.json)" = "$digest"
