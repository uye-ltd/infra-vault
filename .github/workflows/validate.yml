name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'docker/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'vault/**'
      - 'docker/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Vault CLI
        run: |
          VAULT_VERSION="2.0.0"
          VAULT_SHA256="0367bdd46dd1fff1ff19fc44e60df48866515bb519c80527236b3808ea879ac2"
          : "${VAULT_VERSION:?VAULT_VERSION must not be empty}"
          curl -fsSL "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" \
            -o /tmp/vault.zip
          echo "${VAULT_SHA256}  /tmp/vault.zip" | sha256sum -c -
          apt-get install -y --no-install-recommends unzip
          unzip /tmp/vault.zip vault -d /usr/local/bin/
          chmod +x /usr/local/bin/vault

      - name: Start Vault dev server
        run: |
          vault server -dev \
            -dev-root-token-id=ci-token \
            -dev-listen-address=127.0.0.1:8200 \
            > /tmp/vault-dev.log 2>&1 &
          timeout 30 bash -c \
            'until vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; do sleep 1; done'
        env:
          VAULT_SKIP_VERIFY: "true"

      - name: Validate HCL config syntax
        run: |
          vault operator diagnose -config=vault/config/vault.hcl 2>&1 | grep -v "^==" || true
          echo "Config OK"
        env:
          VAULT_SKIP_VERIFY: "true"

      - name: Validate policy files
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ci-token
        run: |
          for f in vault/policies/*.hcl; do
            name=$(basename "$f" .hcl)
            echo "Validating policy: $name"
            vault policy write "$name" "$f"
          done
          echo "All policies valid"
