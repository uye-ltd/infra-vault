name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'docker/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'vault/**'
      - 'docker/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify Vault CLI
        # Vault is baked into the runner image (infra-runner Dockerfile installs it
        # via HashiCorp APT during image build on GitHub-hosted runners).
        # Runtime install is not possible: both releases.hashicorp.com and
        # apt.releases.hashicorp.com return HTTP 404 from the runner server's IP
        # (CloudFront WAF geo-restriction, confirmed by x-amzn-waf-reason: geo header).
        run: vault version

      - name: Start Vault dev server
        run: |
          vault server -dev \
            -dev-root-token-id=ci-token \
            -dev-listen-address=127.0.0.1:8200 \
            > /tmp/vault-dev.log 2>&1 &
          timeout 30 bash -c \
            'until vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; do sleep 1; done'
        env:
          VAULT_SKIP_VERIFY: "true"

      - name: Validate HCL config syntax
        run: |
          vault operator diagnose -config=vault/config/vault.hcl 2>&1 | grep -v "^==" || true
          echo "Config OK"
        env:
          VAULT_SKIP_VERIFY: "true"

      - name: Validate policy files
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ci-token
        run: |
          for f in vault/policies/*.hcl; do
            name=$(basename "$f" .hcl)
            echo "Validating policy: $name"
            vault policy write "$name" "$f"
          done
          echo "All policies valid"
