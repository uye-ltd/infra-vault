name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build, push, and sign vault-unseal image
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign OIDC keyless signing

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push with Kaniko
        run: |
          kaniko \
            --context="${GITHUB_WORKSPACE}/docker/vault-unseal" \
            --dockerfile="Dockerfile" \
            --destination="ghcr.io/uye-ltd/vault-unseal:latest" \
            --destination="ghcr.io/uye-ltd/vault-unseal:${{ github.sha }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            "ghcr.io/uye-ltd/vault-unseal:latest" \
            "ghcr.io/uye-ltd/vault-unseal:${{ github.sha }}"
