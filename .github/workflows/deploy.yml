name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and push vault-unseal image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/vault-unseal
          push: true
          tags: |
            ghcr.io/uye-ltd/vault-unseal:latest
            ghcr.io/uye-ltd/vault-unseal:${{ github.sha }}

  deploy:
    name: Deploy to server
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull updated images
        run: |
          docker compose -f docker/docker-compose.yml pull

      - name: Restart services
        run: |
          docker compose -f docker/docker-compose.yml up -d

      - name: Wait for Vault to be active
        run: |
          timeout 60 bash -c '
            until curl -sf http://127.0.0.1:8200/v1/sys/health 2>/dev/null \
                | grep -q "\"sealed\":false"; do
              sleep 3
            done
          '

      - name: Apply policies
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: ./scripts/apply-policies.sh
