name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build, push, and sign vault-unseal image
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign OIDC keyless signing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Buildah
        id: build
        run: |
          IMAGE=ghcr.io/uye-ltd/vault-unseal
          # --runroot is required when graphRoot is explicitly set in storage.conf
          BUILDAH="buildah --runroot /tmp/buildah-run"
          ${BUILDAH} build \
            --file docker/vault-unseal/Dockerfile \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${{ github.sha }}" \
            docker/vault-unseal
          ${BUILDAH} push --digestfile /tmp/digest.txt "${IMAGE}:latest"
          ${BUILDAH} push "${IMAGE}:${{ github.sha }}"
          echo "digest=$(cat /tmp/digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1
        with:
          cosign-release: 'v2.2.4'

      - name: Sign image
        run: |
          cosign sign --yes \
            --registry-username "${{ github.actor }}" \
            --registry-password "${{ secrets.GITHUB_TOKEN }}" \
            "ghcr.io/uye-ltd/vault-unseal@${{ steps.build.outputs.digest }}"
